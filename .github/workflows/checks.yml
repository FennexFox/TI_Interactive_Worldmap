name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and reproducible build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint
        run: npm run lint && shellcheck scripts/build-wsl.sh
      - name: Build Pages
        run: npm run build
      - name: Verify checked-in build is reproducible
        run: npm run check:generated
      - name: Verify generated data and unit tests
        run: npm run verify

  e2e:
    name: E2E shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Pages
        run: npm run build
      - name: Run Playwright shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
